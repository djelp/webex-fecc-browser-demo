<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Calling — Sign in</title>
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .top {
        height: 64px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .center {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 16px 80px;
      }
      .signin {
        width: 100%;
        max-width: 400px;
        padding: 40px 36px 32px;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }
      .signin h1 {
        font-size: 22px;
      }
      .signin p {
        margin: 0;
      }
      .intro {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #signIn {
        align-self: stretch;
        height: 46px;
        border-radius: 11px;
        font-size: 15px;
      }
      .fine {
        font-size: 12px;
      }
      #message {
        align-self: stretch;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        background: var(--danger-soft);
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="theme-switch" role="group" aria-label="Theme" data-theme-switch>
        <button type="button" data-theme-value="system" aria-pressed="true">System</button>
        <button type="button" data-theme-value="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
    <div class="center">
      <main class="signin">
        <span class="mark mark-lg" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"></rect><path d="M16 10.5l5-3v9l-5-3"></path></svg>
        </span>
        <div class="intro">
          <h1>Room Calling</h1>
          <p class="muted">Call a room and adjust its camera from your browser.</p>
        </div>
        <a id="signIn" class="btn btn-primary" href="/auth/login" hidden>Sign in with Webex</a>
        <p id="checking" class="muted">Checking sign-in…</p>
        <p id="message" role="status" hidden></p>
        <p class="fine muted">Uses your organization's Webex sign-in.</p>
      </main>
    </div>
    <script>
      (function () {
        const AUTH_ERRORS = {
          not_authorized: "Your Webex account isn't allowed to use this page.",
          signin_failed: "Webex sign-in failed. Try again.",
        };
        const signIn = document.getElementById("signIn");
        const checking = document.getElementById("checking");
        const message = document.getElementById("message");

        function show(text) {
          checking.hidden = true;
          signIn.hidden = false;
          message.textContent = text || "";
          message.hidden = !text;
        }

        const authError = new URLSearchParams(location.search).get("authError");
        if (authError) {
          show(AUTH_ERRORS[authError] || AUTH_ERRORS.signin_failed);
          history.replaceState(null, "", location.pathname);
          return;
        }

        // Already signed in? Go straight to the calling page.
        fetch("/auth/session")
          .then((res) => {
            if (res.ok) return location.replace("/call.html");
            if (res.status === 503) {
              checking.hidden = true;
              message.textContent = "Webex sign-in is not configured on the server.";
              message.hidden = false;
              return;
            }
            show("");
          })
          .catch(() => show("Could not reach the server."));
      })();
    </script>
  </body>
</html>
