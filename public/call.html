<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Calling</title>
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .topbar {
        height: 64px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-grow: 1;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #who {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* Layout */
      .layout {
        flex-grow: 1;
        padding: 20px;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 320px;
        gap: 20px;
        min-height: 0;
      }
      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .topbar {
          padding: 0 16px;
        }
        #whoName {
          display: none;
        }
      }
      @media (max-width: 560px) {
        .topbar {
          gap: 10px;
        }
        .brand-name {
          display: none;
        }
      }

      /* Rooms */
      .rooms {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .rooms-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      #roomsMessage {
        margin: 0;
        font-size: 13px;
      }
      #roomsMessage.err {
        color: var(--danger);
      }
      #roomList {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .room {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border-radius: 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      .room.active {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .room-top,
      .room-bottom {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .room-name {
        flex-grow: 1;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .room-sip {
        flex-grow: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Stage */
      .stage {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .stage-head {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 40px;
      }
      .stage-title {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        min-width: 0;
      }
      #callLabel {
        font-size: 18px;
      }
      #callSub {
        font-size: 13px;
      }
      #message {
        margin: 0;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        background: var(--surface-2);
        color: var(--text);
      }
      #message.err {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .video-wrap {
        position: relative;
        flex-grow: 1;
        min-height: 360px;
        border-radius: 14px;
        background: var(--video);
        overflow: hidden;
      }
      #remoteVideo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      #placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        color: #7f9199;
      }
      #selfView {
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: 22%;
        min-width: 140px;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        background: #1b262c;
        transform: scaleX(-1);
      }

      /* Right column */
      #controls {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .section {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .room-mic {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mic-state {
        flex-grow: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        background: var(--surface-2);
        color: var(--muted);
      }
      .mic-state::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .mic-state.live {
        background: var(--success-soft);
        color: var(--success);
      }
      .mic-state.muted {
        background: var(--danger-soft);
        color: var(--danger);
      }
      #roomMicError {
        margin: 0;
        font-size: 12px;
        color: var(--danger);
      }

      /* Camera pad */
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(3, 56px);
        gap: 8px;
        justify-content: center;
      }
      .pad-btn,
      .zoom-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
        touch-action: none;
        user-select: none;
        transition: background-color 120ms ease, border-color 120ms ease;
      }
      .pad-btn {
        border-radius: 50%;
      }
      .zoom-btn {
        width: 88px;
        height: 44px;
        border-radius: 12px;
        font-weight: 500;
      }
      .pad-btn:hover:not(:disabled),
      .zoom-btn:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .pad-btn:active:not(:disabled),
      .zoom-btn:active:not(:disabled) {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .pad-btn:disabled,
      .zoom-btn:disabled {
        color: var(--muted);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .pad-center {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--accent-soft);
      }
      .pad-center span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
      }
      .zoom-row {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .divider {
        height: 1px;
        background: var(--border);
      }
      .sliders {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .slider {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
      }
      .slider-label {
        display: flex;
        justify-content: space-between;
      }
      .slider-label .val {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .slider input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      #status {
        min-height: 18px;
        font-size: 12px;
        color: var(--muted);
      }
      #status:empty::before {
        content: "Hold an arrow to move the camera.";
      }
      #status.ok {
        color: var(--success);
      }
      #status.err {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"></rect><path d="M16 10.5l5-3v9l-5-3"></path></svg>
        </span>
        <span class="brand-name">Room Calling</span>
      </div>
      <div id="who" hidden>
        <span id="whoName" class="muted"></span>
      </div>
      <div class="theme-switch" role="group" aria-label="Theme" data-theme-switch>
        <button type="button" data-theme-value="system" aria-pressed="true">System</button>
        <button type="button" data-theme-value="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
      </div>
      <button type="button" id="signOut" class="btn btn-sm">Sign out</button>
    </header>

    <div class="layout">
      <aside class="card rooms" aria-label="Rooms">
        <div class="rooms-head">
          <h2 class="card-title">Rooms</h2>
        </div>
        <p id="roomsMessage" class="muted">Checking sign-in…</p>
        <ul id="roomList"></ul>
      </aside>

      <main class="card stage">
        <div class="stage-head">
          <div class="stage-title">
            <h1 id="callLabel">Not in a call</h1>
            <span id="callSub" class="muted">Choose a room to call</span>
          </div>
          <button type="button" id="muteBtn" class="btn" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
            <span id="muteLabel">Mute me</span>
          </button>
          <button type="button" id="hangupBtn" class="btn btn-danger" hidden>Hang up</button>
        </div>
        <p id="message" role="status" hidden></p>
        <div class="video-wrap">
          <video id="remoteVideo" autoplay playsinline></video>
          <div id="placeholder">Choose a room and click Dial.</div>
          <video id="selfView" autoplay playsinline muted hidden></video>
        </div>
        <audio id="remoteAudio" autoplay></audio>
      </main>

      <aside id="controls" aria-label="Room controls">
        <section class="card section">
          <h2 class="card-title">Room microphone</h2>
          <div class="room-mic">
            <span id="roomMicState" class="mic-state">Not in a call</span>
            <button type="button" id="roomMicBtn" class="btn btn-sm" disabled>Mute room</button>
          </div>
          <p id="roomMicError" hidden></p>
        </section>

        <section class="card section">
          <h2 class="card-title">Camera</h2>
          <div class="pad">
            <span></span>
            <button type="button" class="pad-btn" data-direction="up" aria-label="Tilt up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
            <span></span>
            <button type="button" class="pad-btn" data-direction="left" aria-label="Pan left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
            <span class="pad-center" aria-hidden="true"><span></span></span>
            <button type="button" class="pad-btn" data-direction="right" aria-label="Pan right"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
            <span></span>
            <button type="button" class="pad-btn" data-direction="down" aria-label="Tilt down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
            <span></span>
          </div>
          <div class="zoom-row">
            <button type="button" class="zoom-btn" data-direction="zoom-out" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg>Out</button>
            <button type="button" class="zoom-btn" data-direction="zoom-in" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg>In</button>
          </div>
          <div class="divider"></div>
          <div class="sliders">
            <label class="slider" for="panSpeed">
              <span class="slider-label"><span>Pan speed</span><span class="val" id="panSpeedOut">12</span></span>
              <input type="range" id="panSpeed" min="1" max="24" step="1" value="12" />
            </label>
            <label class="slider" for="tiltSpeed">
              <span class="slider-label"><span>Tilt speed</span><span class="val" id="tiltSpeedOut">12</span></span>
              <input type="range" id="tiltSpeed" min="1" max="24" step="1" value="12" />
            </label>
            <label class="slider" for="zoomSpeed">
              <span class="slider-label"><span>Zoom speed</span><span class="val" id="zoomSpeedOut">8</span></span>
              <input type="range" id="zoomSpeed" min="1" max="15" step="1" value="8" />
            </label>
          </div>
          <div id="status" role="status"></div>
        </section>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/webex@3.12.0/umd/webex.min.js"></script>
    <script src="/fecc-controls.js"></script>
    <script src="/webex-call.js"></script>
  </body>
</html>
